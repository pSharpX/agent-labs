
services:
  pgvector:
    image: pgvector/pgvector:pg16
    profiles: [rag]
    container_name: pgvector
    restart: always
    environment:
      POSTGRES_USER: pgvector_user
      POSTGRES_PASSWORD: p4ssw0rd
      POSTGRES_DB: vectordb
    ports:
      - "5442:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pgvector_user -d vectordb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  liquibase:
    profiles: [rag]
    build:
      context: ./liquibase
    depends_on:
      pgvector:
        condition: service_healthy
    volumes:
      - ${PWD}/db/changelog/:/liquibase/changelog
    command: >
      --changeLogFile=./db.changelog-1.0.yaml
      --url=jdbc:postgresql://pgvector:5432/vectordb
      --driver=org.postgresql.Driver
      --classpath=/liquibase/changelog
      --username=pgvector_user
      --password=p4ssw0rd
      update

  chroma:
    profiles: [doc_store]
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSISTIST_DIRECTORY=/data
    restart: unless-stopped

  crawl4ai:
    image: unclecode/crawl4ai:latest
    profiles: [crawl4ai]
    container_name: crawl4ai
    ports:
      - "11235:11235"
    env_file:
    # API keys (create from .llm.env.example); optional so a fresh clone runs.
    - path: .llm.env
      required: false
    environment:
      # Auth token passthrough from the host shell (overwrites .llm.env).
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:-}
      # Uncomment to set default environment variables (will overwrite .llm.env)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # - GROQ_API_KEY=${GROQ_API_KEY:-}
      # - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      # - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      # - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # - LLM_PROVIDER=${LLM_PROVIDER:-}  # Optional: Override default provider (e.g., "anthropic/claude-3-opus")
    # Chromium needs shared memory but the host /dev/shm bind was a shared,
    # writable mount; use a private sized tmpfs instead.
    shm_size: '1g'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem; only these paths are writable (tmpfs).
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/redis:uid=999,gid=999,mode=0700
      - /var/lib/crawl4ai/outputs:uid=999,gid=999,mode=0700
      - /home/appuser/.crawl4ai:uid=999,gid=999,mode=0700
      # Keep the baked Playwright browser under ~/.cache/ms-playwright visible.
      - /home/appuser/.cache/url_seeder:uid=999,gid=999,mode=0700
      - /home/appuser/.gunicorn:uid=999,gid=999,mode=0700
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://crawl4ai:11235/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    user: "appuser"

volumes:
  pgvector_data:
  chroma_data:
